<!--
  Supabase > Authentication > Emails > "Change email address"
  Subject: Your SomeDaisy code
  Sent when a guest adds their email to keep their groups.
  The logo is served by the website from public/email/logo.png.
-->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">Your code is {{ .Token }}. Enter it in the app to save your account.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F6F0FB;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background-color:#FFFFFF;border-radius:24px;">
        <tr>
          <td align="center" style="padding:36px 32px 8px 32px;">
            <img src="https://somedaisy.com/email/logo.png" width="200" height="46" alt="SomeDaisy" style="display:block;border:0;width:200px;height:46px;">
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 32px 0 32px;font-family:Nunito,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#2C2040;">
            <h1 style="margin:0;font-size:24px;line-height:30px;font-weight:800;">Keep your groups</h1>
            <p style="margin:10px 0 0 0;font-size:16px;line-height:24px;color:#625475;">Enter this code in the app to save your account with {{ .NewEmail }}.</p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 32px 0 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="background-color:#E6D2FF;border-radius:16px;padding:16px 28px;font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:34px;line-height:40px;font-weight:700;letter-spacing:8px;color:#5A25A6;">{{ .Token }}</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:28px 32px 36px 32px;font-family:Nunito,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#2C2040;">
            <p style="margin:0;font-size:16px;line-height:24px;font-weight:700;">Hope you have a great day! &#127804;</p>
          </td>
        </tr>
      </table>
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
        <tr>
          <td align="center" style="padding:20px 32px 0 32px;font-family:Nunito,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#625475;">
            If you did not ask for this code, you can ignore this email. Nothing changes without it.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
